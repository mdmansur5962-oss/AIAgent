name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Java JDK সেটআপ করা (অ্যান্ড্রয়েড বিল্ডের জন্য প্রয়োজন)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Gradle ক্যাশ সক্ষম করা যাতে পরেরবার বিল্ড দ্রুত হয়
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Gradle Wrapper-এ পার্মিশন দেওয়া
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # প্রজেক্ট বিল্ড ও ডিবাগ এপিকে তৈরি করা
    - name: Build with Gradle
      run: ./gradlew assembleDebug
